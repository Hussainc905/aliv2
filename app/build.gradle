plugins { id 'com.android.application' }

android {
    namespace 'com.elyastech.elyasfun'
    compileSdk 35
    defaultConfig {
        applicationId 'com.elyastech.elyasfun'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '3.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
